{% extends 'base.html' %}{% block content %}<p class="eyebrow">ГЕОГРАФИЯ ДОСТАВОК</p><h1>Зоны обслуживания</h1><p>Дневная вместимость и тип каждой зоны.</p><div class="grid">{% for zone in zones %}<article class="card"><p class="eyebrow">{{ zone.zone_type|upper }}</p><h2>{{ zone.name }}</h2><p><strong>{{ zone.capacity }}</strong> заказов в день</p></article>{% empty %}<p class="empty">Зоны пока не добавлены.</p>{% endfor %}</div>{% endblock %}

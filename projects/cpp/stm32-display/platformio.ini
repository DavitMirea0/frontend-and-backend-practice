[platformio]
default_envs = lab2_all

[env]
platform = ststm32
board = genericSTM32F407VGT6
framework = stm32cube
upload_protocol = stlink
debug_tool = stlink
build_flags = -Wall -Wextra

[env:static_digit]
build_flags = ${env.build_flags} -DLAB_MODE=1

[env:dynamic_year]
build_flags = ${env.build_flags} -DLAB_MODE=2

[env:button_year]
build_flags = ${env.build_flags} -DLAB_MODE=3

[env:lab2_all]
build_flags = ${env.build_flags} -DLAB_MODE=4

[env:seconds_counter]
build_flags = ${env.build_flags} -DLAB_MODE=5

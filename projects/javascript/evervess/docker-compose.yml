services:
  # ─────────────────────────────────────────
  #  PostgreSQL
  # ─────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: evervess_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-bankapp}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # initdb/ содержит только 00_init.sh — никаких .sql файлов здесь!
      - ./initdb:/docker-entrypoint-initdb.d:ro
      # init.sql монтируется отдельно в /tmp чтобы скрипт мог его обработать
      - ./server/init.sql:/tmp/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-bankapp}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - evervess_net

  # ─────────────────────────────────────────
  #  Backend (Node.js / Express)
  # ─────────────────────────────────────────
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: evervess_server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-bankapp}
      JWT_SECRET: ${JWT_SECRET:-evervess_secret_key_2026}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-evervess_refresh_secret_2026}
      NODE_ENV: production
    ports:
      - "5000:5000"
    networks:
      - evervess_net

  # ─────────────────────────────────────────
  #  Frontend (React → nginx)
  # ─────────────────────────────────────────
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:5000}
    container_name: evervess_client
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "3000:80"
    networks:
      - evervess_net

volumes:
  postgres_data:
    name: evervess_postgres_data

networks:
  evervess_net:
    name: evervess_network
    driver: bridge

name: it-equipment
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: it_equipment
      POSTGRES_USER: it_app
      POSTGRES_PASSWORD: it_demo_password
    ports:
      - "127.0.0.1:${DB_PORT:-55433}:5432"
    volumes:
      - it_equipment_data:/var/lib/postgresql/data
      - ./sql/01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./sql/02-seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U it_app -d it_equipment"]
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    image: postgres:16
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: it_demo_password
    volumes:
      - ./sql/03-cascade-delete.sql:/migrations/03-cascade-delete.sql:ro
    command: ["psql", "-h", "db", "-U", "it_app", "-d", "it_equipment", "-v", "ON_ERROR_STOP=1", "-f", "/migrations/03-cascade-delete.sql"]
    restart: "no"
volumes:
  it_equipment_data:

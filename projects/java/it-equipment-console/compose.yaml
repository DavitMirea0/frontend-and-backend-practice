services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: it_equipment
      POSTGRES_USER: it_app
      POSTGRES_PASSWORD: it_demo_password
    volumes:
      - it_equipment_data:/var/lib/postgresql/data
      - ./sql/01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./sql/02-seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U it_app -d it_equipment"]
      interval: 3s
      timeout: 3s
      retries: 20
  app:
    build: .
    profiles: ["cli"]
    working_dir: /app
    stdin_open: true
    tty: true
    environment:
      DB_URL: jdbc:postgresql://db:5432/it_equipment
      DB_USER: it_app
      DB_PASSWORD: it_demo_password
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./exports:/app/exports
    entrypoint: ["java", "-Dfile.encoding=UTF-8", "-jar", "/app/it-equipment.jar"]
volumes:
  it_equipment_data:
